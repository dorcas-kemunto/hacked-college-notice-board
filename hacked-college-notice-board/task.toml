schema_version = "1.3"

[task]
name = "dorcas/hacked-college-notice-board"
description = "Clean up a hacked PHP notice board server: find and remove every backdoor the attacker left, put back what they changed and close the upload hole, without breaking the site."
keywords = ["incident-response", "forensics", "linux", "apache", "php-fpm", "web-shell", "persistence"]

[metadata]
difficulty = "hard"
category = "cybersecurity"
subcategory = "incident-response"
expert_time_estimate_hours = 3

[agent]
timeout_sec = 36000.0
user = "root"

[verifier]
timeout_sec = 900.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
